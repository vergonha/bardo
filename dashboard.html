<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bardo</title>
    <script type="module" src="./src/dashboard.ts"></script>
    <link rel="stylesheet" href="./assets/css/ux.css" />
    <link rel="stylesheet" href="./assets/css/footer.css" />
    <link rel="stylesheet" href="./assets/css/playlists.css" />
    <link rel="stylesheet" href="./assets/css/search.css" />
    <link rel="stylesheet" href="./assets/css/queue.css" />
    <link rel="stylesheet" href="./assets/css/main.css" />
    <link rel="stylesheet" href="./assets/css/dashboard.css" />
    <link rel="stylesheet" href="./assets/css/variables.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="main-content">
      <aside>
        <div class="project-title">
          <i class="fa-brands fa-spotify"></i>
          <h1>Bardo</h1>
        </div>
        <div class="playlists">
          <ul id="playlist-list"></ul>
        </div>
      </aside>
      <main>
        <div class="playlist-content">
          <div class="playlist">
            <div class="playlist-image">
              <img class="playlist-image-object" src="" alt="" />
            </div>
            <div class="playlist-title">
              <h3 class="playlist-main-title"></h3>
              <h3 class="playlist-description"></h3>
            </div>
            <a class="play-button" style="display: none">
              <i class="fa-solid fa-circle-play"></i>
            </a>
          </div>
          <ul class="playlist-tracks"></ul>
        </div>
      </main>
      <article>
        <div class="search-content" id="search-panel">
          <div class="search-container">
            <input type="text" id="search" placeholder="Search.." />
            <i class="fa fa-search"></i>
          </div>
          <div class="search-results">
            <div class="results">
              <div class="playlists-results"></div>
              <div class="tracks-results"></div>
            </div>
          </div>
        </div>
        <div class="queue-panel" id="queue-panel" style="display: none">
          <div class="queue-header">
            <h3>Queue</h3>
            <span id="queue-count">0 tracks</span>
          </div>
          <ul class="queue-list" id="queue-list"></ul>
          <p class="queue-empty" id="queue-empty">Queue is empty</p>
        </div>
      </article>
      <footer>
        <div class="card">
          <div class="track-image">
            <img class="track-image-object" src="" alt="" />
          </div>
          <div class="card-title">
            <h3 class="track-title"></h3>
            <h4 class="artists-title"></h4>
            <p class="album-title"></p>
          </div>
        </div>
        <div class="controller-player">
          <div class="controller-buttons">
            <button id="previousTrack">
              <i class="fa-solid fa-backward"></i>
            </button>
            <button id="toggle">
              <i class="fa-solid fa-pause"></i>
              <i class="fa-solid fa-play" style="display: none"></i>
            </button>
            <button id="nextTrack">
              <i class="fa-solid fa-forward"></i>
            </button>
          </div>
          <div class="track-controller">
            <p>0:00</p>
            <input type="range" id="seek" value="0" />
            <p class="track-time">0:00</p>
          </div>
        </div>
        <div class="volume-slider">
          <button id="queue-toggle" title="Toggle queue">
            <i class="fa-solid fa-list"></i>
          </button>
          <i class="fa-solid fa-volume-high"></i>
          <input type="range" id="volume-control" value="50" />
        </div>
      </footer>
    </div>
  </body>
</html>
