<div class="main-content">
    <aside>
        <div class="project-title" id="home-link" title="Home">
            <i class="fa-brands fa-spotify"></i>
            <h1>bardo</h1>
        </div>
        <div class="sidebar-search-button" id="search-link" title="search">
            <i class="fa fa-search"></i>
            <h1>search</h1>
        </div>
        <div class="playlists">
            <ul id="playlist-list"></ul>
        </div>
    </aside>
    <main>
        <div class="home-content"></div>
        <div class="playlist-content" style="display: none">
            <div class="playlist">
                <div class="playlist-image">
                    <img class="playlist-image-object" src="" alt="" />
                </div>
                <div class="playlist-title">
                    <span class="playlist-label">PLAYLIST</span>
                    <h1 class="playlist-main-title"></h1>
                    <p class="playlist-description"></p>

                    <div class="playlist-meta">
                        <a class="play-button" style="display: none">
                            <i class="fa-solid fa-circle-play"></i>
                        </a>
                        <span class="meta-owner"></span>
                        <span class="meta-divider">•</span>
                        <span class="meta-songs">0 tracks</span>
                    </div>
                </div>
            </div>
            <ul class="playlist-tracks"></ul>
        </div>
        <div class="artist-content" style="display: none">
            <div class="artist-hero">
                <div class="artist-hero-image">
                    <img class="artist-image-object" src="" alt="" />
                </div>
                <div class="artist-hero-info">
                    <span class="playlist-label">ARTIST</span>
                    <h1 class="artist-main-title"></h1>
                    <p class="artist-meta"></p>
                    <a class="play-button artist-play-button" style="display: none">
                        <i class="fa-solid fa-circle-play"></i>
                    </a>
                </div>
            </div>
            <div class="artist-shelves"></div>
        </div>
        <div class="search-page" style="display: none">
            <div class="search-page-input">
                <i class="fa fa-search"></i>
                <input type="text" id="search" placeholder="What do you want to listen to?" />
            </div>
            <div class="search-page-results" style="display: none">
                <section class="shelf">
                    <h2 class="shelf-title">Songs</h2>
                    <div class="tracks-results"></div>
                </section>
                <section class="shelf">
                    <h2 class="shelf-title">Artists</h2>
                    <div class="artists-results"></div>
                </section>
                <section class="shelf">
                    <h2 class="shelf-title">Albums</h2>
                    <div class="albums-results"></div>
                </section>
            </div>
        </div>
    </main>
    <article style="display: flex">
        <div class="queue-panel" id="queue-panel">
            <div class="queue-header">
                <h3>Queue</h3>
                <span id="queue-count">0 tracks</span>
            </div>
            <ul class="queue-list" id="queue-list"></ul>
            <p class="queue-empty" id="queue-empty">Queue is empty</p>
        </div>
    </article>
    <footer>
        <div class="card">
            <div class="track-image">
                <img class="track-image-object" src="" alt="" />
            </div>
            <div class="card-title">
                <h3 class="track-title"></h3>
                <h4 class="artists-title"></h4>
                <p class="album-title"></p>
            </div>
        </div>
        <div class="controller-player">
            <div class="controller-buttons">
                <button id="previousTrack">
                    <i class="fa-solid fa-backward"></i>
                </button>
                <button id="toggle">
                    <i class="fa-solid fa-pause"></i>
                    <i class="fa-solid fa-play" style="display: none"></i>
                </button>
                <button id="nextTrack">
                    <i class="fa-solid fa-forward"></i>
                </button>
            </div>
            <div class="track-controller">
                <p>0:00</p>
                <input type="range" id="seek" value="0" />
                <p class="track-time">0:00</p>
            </div>
        </div>
        <div class="volume-slider">
            <button id="queue-toggle" class="active" title="Toggle queue">
                <i class="fa-solid fa-list"></i>
            </button>
            <i class="fa-solid fa-volume-high"></i>
            <input type="range" id="volume-control" value="50" />
        </div>
    </footer>
</div>
